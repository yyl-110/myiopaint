name: Sync Docker Image to Tencent CCR

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Login to Tencent CCR
        uses: docker/login-action@v3
        with:
          registry: ccr.ccs.tencentyun.com
          username: ${{ secrets.TENCENT_USERNAME }}
          password: ${{ secrets.TENCENT_PASSWORD }}

      - name: Pull and Push IOPaint Image
        run: |
          # 1. 使用带具体版本号的 GitHub 官方镜像，或者 HuggingFace 转存镜像
          docker pull ghcr.io/sanster/iopaint:1.2.0 || docker pull ghcr.io/sanster/iopaint:main
          
          # 2. 标记镜像 Tag（获取拉取成功的镜像并重新打标）
          docker tag $(docker images -q | head -n 1) ccr.ccs.tencentyun.com/myiopaint/iopaint:latest
          
          # 3. 推送到腾讯云 CCR
          docker push ccr.ccs.tencentyun.com/myiopaint/iopaint:latest
