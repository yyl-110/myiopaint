name: Build and Push IOPaint to Tencent CCR

on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      # 1. 下载 IOPaint 官方源代码
      - name: Checkout IOPaint Repository
        uses: actions/checkout@v4
        with:
          repository: 'Sanster/IOPaint'
          ref: 'main'

      # 2. 修正老旧 Dockerfile 的全部语法问题
      - name: Fix Dockerfile syntax
        run: |
          # 升级过期的 Debian 基础镜像
          sed -i 's/python:3.10.11-slim-buster/python:3.10-slim-bookworm/g' ./docker/CPUDockerfile
          
          # 替换安装包命令
          sed -i 's/pip install lama-cleaner==$version/pip install iopaint/g' ./docker/CPUDockerfile
          
          # 修正插件安装命令（--install-plugins-package 替换为新命令 install-plugins）
          sed -i 's/iopaint --install-plugins-package/iopaint install-plugins/g' ./docker/CPUDockerfile
          sed -i 's/lama-cleaner --install-plugins-package/iopaint install-plugins/g' ./docker/CPUDockerfile
          
          # 屏蔽导致报错的旧版 LD_PRELOAD
          sed -i 's/ENV LD_PRELOAD/# ENV LD_PRELOAD/g' ./docker/CPUDockerfile

      # 3. 登录腾讯云镜像仓库
      - name: Login to Tencent CCR
        uses: docker/login-action@v3
        with:
          registry: ccr.ccs.tencentyun.com
          username: ${{ secrets.TENCENT_USERNAME }}
          password: ${{ secrets.TENCENT_PASSWORD }}

      # 4. 设置 Docker Buildx 构建器
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 5. 构建并推送到腾讯云 CCR
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/CPUDockerfile
          push: true
          tags: ccr.ccs.tencentyun.com/myiopaint/iopaint:latest
