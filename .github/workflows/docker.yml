name: Build and Push IOPaint to Tencent CCR

on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      # 1. 下载 IOPaint 官方源代码
      - name: Checkout IOPaint Repository
        uses: actions/checkout@v4
        with:
          repository: 'Sanster/IOPaint'
          ref: 'main'

      # 2. 登录你的腾讯云镜像仓库
      - name: Login to Tencent CCR
        uses: docker/login-action@v3
        with:
          registry: ccr.ccs.tencentyun.com
          username: ${{ secrets.TENCENT_USERNAME }}
          password: ${{ secrets.TENCENT_PASSWORD }}

      # 3. 设置 Docker Buildx 构建器
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. 直接构建 CPU 版 IOPaint 镜像并推送到腾讯云 CCR
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/CPUDockerfile  # 使用官方 CPU Dockerfile 快速构建
          push: true
          tags: ccr.ccs.tencentyun.com/myiopaint/iopaint:latest
