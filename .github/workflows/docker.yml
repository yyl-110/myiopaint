name: Build and Push IOPaint to Tencent CCR

on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      # 1. 下载 IOPaint 官方源代码
      - name: Checkout IOPaint Repository
        uses: actions/checkout@v4
        with:
          repository: 'Sanster/IOPaint'
          ref: 'main'

      # 2. 直接重写完整的 CPUDockerfile，彻底消除 sed 替换引发的语法叠加
      - name: Rewrite CPUDockerfile
        run: |
          cat << 'EOF' > ./docker/CPUDockerfile
          FROM python:3.10-slim-bookworm

          RUN apt-get update && apt-get install -y --no-install-recommends \
              software-properties-common \
              libsm6 libxext6 ffmpeg libfontconfig1 libxrender1 libgl1-mesa-glx \
              curl gcc build-essential \
              && rm -rf /var/lib/apt/lists/*

          RUN pip install --no-cache-dir iopaint
          RUN iopaint install-plugins-packages

          EXPOSE 8080
          CMD ["iopaint", "start", "--model=lama", "--device=cpu", "--port=8080", "--host=0.0.0.0"]
          EOF

      # 3. 登录腾讯云镜像仓库
      - name: Login to Tencent CCR
        uses: docker/login-action@v3
        with:
          registry: ccr.ccs.tencentyun.com
          username: ${{ secrets.TENCENT_USERNAME }}
          password: ${{ secrets.TENCENT_PASSWORD }}

      # 4. 设置 Docker Buildx 构建器
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 5. 构建并推送到腾讯云 CCR
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/CPUDockerfile
          push: true
          tags: ccr.ccs.tencentyun.com/myiopaint/iopaint:latest
